name: Build and Push Docker Images to GHCR

# This workflow builds and pushes two Docker images to GitHub Container Registry (ghcr.io):
# 1. analytics-engine: Java-based SQL planning engine (analytics-core-legacy)
# 2. analytics-engine-ibis: Python-based ibis server with Rust core bindings

permissions:
  contents: write
  packages: write
  pull-requests: write

on:
  push:
    branches:
      - main
      - renaming-whole-project  # Allow building from this branch for testing
  workflow_dispatch:
    inputs:
      docker_image_tag_name:
        type: string
        description: 'Docker image tag name (Optional)'
      branch:
        type: string
        description: 'Branch to build from (default: current branch)'
        default: ''
        required: false

env:
  # GitHub Container Registry image names
  ENGINE_IMAGE: ghcr.io/canner/analytics-engine
  IBIS_IMAGE: ghcr.io/canner/analytics-engine-ibis

jobs:
  prepare-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare tag name
        id: prepare_tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # For push events, use commit SHA and branch name
            echo "type=sha" > tags.txt
            echo "type=ref,event=branch" >> tags.txt
            # Also add latest tag for main branch only
            if [ "${{ github.ref_name }}" = "main" ]; then
              echo "type=raw,value=latest" >> tags.txt
            fi
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.docker_image_tag_name }}" ]; then
              tag_name=${{ github.event.inputs.docker_image_tag_name }}
            else
              # Use branch name and commit SHA
              branch_name="${{ github.event.inputs.branch }}"
              if [ -z "$branch_name" ]; then
                branch_name="${{ github.ref_name }}"
              fi
              tag_name=$(echo "$branch_name" | sed 's/[^a-zA-Z0-9]/-/g')-$(git log -1 --pretty=%h)
            fi
            echo "type=raw,value=$tag_name" > tags.txt
          fi
          echo "tags=$(cat tags.txt)" >> $GITHUB_OUTPUT
    outputs:
      tags: ${{ steps.prepare_tag.outputs.tags }}
  # Build and push Java Engine (analytics-engine)
  build-java-engine:
    needs: prepare-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Make mvnw executable
        working-directory: analytics-core-legacy
        run: chmod +x ./mvnw
      - name: Build Java Engine JAR
        working-directory: analytics-core-legacy
        run: |
          ./mvnw clean install -B -DskipTests -Dcheckstyle.skip=true -Dair.check.skip-dependency=true -P exec-jar
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ENGINE_IMAGE }}
          tags: |
            ${{ needs.prepare-tag.outputs.tags }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Prepare
        working-directory: analytics-core-legacy
        id: prepare
        run: |
          # mvnw should already be executable from previous step
          ANALYTICS_VERSION=$(./mvnw --quiet help:evaluate -Dexpression=project.version -DforceStdout)
          cp ./analytics-server/target/analytics-server-${ANALYTICS_VERSION}-executable.jar ./docker
          echo "ANALYTICS_VERSION=$ANALYTICS_VERSION" >> "$GITHUB_OUTPUT"
      - name: Build and push Java Engine image
        uses: docker/build-push-action@v5
        with:
          context: ./analytics-core-legacy/docker
          file: ./analytics-core-legacy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args:
            ANALYTICS_VERSION=${{ steps.prepare.outputs.ANALYTICS_VERSION }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # Build and push Ibis Server (analytics-engine-ibis)
  # Uses multi-stage build with separate jobs for each platform, then merges manifests
  build-ibis-image:
    needs: prepare-tag
    strategy:
      fail-fast: false
      matrix:
        arch:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-latest
            platform: linux/arm64
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - name: Prepare platform
        id: platform
        run: |
          platform="${{ matrix.arch.platform }}"
          PLATFORM_PAIR="${platform//\//-}"
          echo "PLATFORM_PAIR=${PLATFORM_PAIR}" >> $GITHUB_ENV
          echo "platform_pair=${PLATFORM_PAIR}" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IBIS_IMAGE }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up QEMU (for ARM64)
        if: matrix.arch.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.arch.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          context: ./ibis-server
          file: ./ibis-server/Dockerfile
          build-contexts: |
            analytics-core-py=./analytics-core-py
            analytics-core=./analytics-core
            analytics-core-base=./analytics-core-base
          outputs: type=image,name=${{ env.IBIS_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform.outputs.platform_pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
  # Merge multi-platform manifests for ibis-server image
  merge-ibis-manifests:
    runs-on: ubuntu-latest
    needs: [ prepare-tag, build-ibis-image ]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IBIS_IMAGE }}
          tags: |
            ${{ needs.prepare-tag.outputs.tags }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          TAGS=$(echo "${{ steps.meta.outputs.tags }}" | awk '{printf "--tag %s ", $0}')
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IBIS_IMAGE }}@sha256:%s ' *) \
            $TAGS
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ steps.meta.outputs.tags }}
